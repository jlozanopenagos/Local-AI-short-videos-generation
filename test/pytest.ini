[pytest]
testpaths = .
pythonpath = ../main .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Fast deterministic unit tests (memory only)
    integration: Integration tests with mock servers
    contract: Schema and data contract validation
    security: Privacy, .gitignore, and secret leak detection
