name: Shorts Studio tests

on:
  pull_request:
  push:

jobs:
  studio:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            main/requirements.txt
            test/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: main/webui/frontend/package-lock.json
      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "$env:ChocolateyInstall/bin"
      - name: Install Python test dependencies
        run: |
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r main/requirements.txt -r test/requirements-test.txt
      - name: Build production frontend
        working-directory: main/webui/frontend
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Backend and media workflow
        run: python -m pytest test -m "not browser and not live"
      - name: Browser workflow
        run: python -m pytest test/browser
